<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Sudoku</title>
</head>
<body>
    <main class="game">
        <header class="game-header">
            <h1>Sudoku</h1>
            <p>Fill every row, column, and 3×3 box with 1–9.</p>
        </header>

        <div class="toolbar">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="new-game" class="primary" type="button">New game</button>
        </div>

        <p id="mistake-counter">Mistakes: 0</p>
        <div id="board-container" aria-label="Sudoku board" role="group"></div>
        <div id="number-buttons" aria-label="Enter a number" role="group">
            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
        </div>
        <div class="actions">
            <button id="erase" type="button">Erase</button>
            <button id="check-solution" type="button">Check solution</button>
        </div>
        <p id="game-status" role="status"></p>
        <p id="controls-hint">Select a square, then type a number or use the keypad. Arrow keys move between squares.</p>
    </main>
    <footer>Made by Will Legg · <a href="https://github.com/leggw/Sudoku">GitHub</a></footer>
</body>
</html>
